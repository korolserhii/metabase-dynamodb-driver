name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by auto-update.yml to try a newer Metabase before anything is released.
  workflow_call:
    inputs:
      metabase_version:
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # The Metabase version lives in metabase-version.txt (not in this file), so the auto-update
  # workflow can bump it: GitHub does not let workflows edit workflow files.
  version:
    runs-on: ubuntu-latest
    outputs:
      metabase: ${{ steps.v.outputs.metabase }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: metabase-version.txt
          sparse-checkout-cone-mode: false
      - id: v
        run: |
          v="${{ inputs.metabase_version }}"
          [ -n "$v" ] || v=$(tr -d ' \r\n' < metabase-version.txt)
          echo "Metabase $v"
          echo "metabase=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    env:
      METABASE_VERSION: ${{ needs.version.outputs.metabase }}
    steps:
      - name: Check out Metabase ${{ env.METABASE_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: metabase/metabase
          ref: ${{ env.METABASE_VERSION }}

      - name: Check out the driver
        uses: actions/checkout@v4
        with:
          path: modules/drivers/dynamodb

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Clojure CLI
        run: |
          curl -sSL -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: deps-${{ env.METABASE_VERSION }}-${{ hashFiles('modules/drivers/dynamodb/deps.edn') }}

      - name: Build the driver
        run: |
          set -o pipefail
          mkdir -p ci-logs
          echo '{:deps {metabase/dynamodb {:local/root "dynamodb"}}}' > modules/drivers/deps.edn
          ./bin/build-driver.sh dynamodb 2>&1 | tee ci-logs/build.log
          jar=$(find . -name 'dynamodb.metabase-driver.jar' -not -path './node_modules/*' | head -1)
          echo "built: $jar"; ls -la "$jar"
          unzip -l "$jar" | grep -E "metabase-plugin.yaml|dynamodb" | tee ci-logs/jar-contents.txt
          mkdir -p out && cp "$jar" out/

      - uses: actions/upload-artifact@v4
        with:
          name: dynamodb.metabase-driver.jar
          path: out/dynamodb.metabase-driver.jar

      - name: Publish logs to the ci-logs-build branch
        if: always()
        working-directory: ci-logs
        run: |
          git init -q -b logs
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "build logs, run ${{ github.run_id }}" --allow-empty
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-build

  e2e:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      METABASE_VERSION: ${{ needs.version.outputs.metabase }}
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@v4
        with:
          name: dynamodb.metabase-driver.jar
          path: plugins

      - name: Download Metabase ${{ env.METABASE_VERSION }}
        run: curl -sSL -o metabase.jar "https://downloads.metabase.com/${METABASE_VERSION}/metabase.jar"

      - name: Start Metabase
        run: |
          mkdir -p ci-logs mbdata
          MB_PLUGINS_DIR=$PWD/plugins MB_DB_FILE=$PWD/mbdata/metabase.db \
            nohup java -jar metabase.jar > ci-logs/metabase.log 2>&1 &

      - name: Run end-to-end checks
        run: |
          set -o pipefail
          pip install --quiet boto3
          python3 test/e2e/e2e.py 2>&1 | tee ci-logs/e2e.log

      - name: Publish logs to the ci-logs-e2e branch
        if: always()
        working-directory: ci-logs
        run: |
          git init -q -b logs
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "e2e logs, run ${{ github.run_id }}" --allow-empty
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-e2e

  release:
    # Publishes a GitHub release when the version in the plugin manifest has no release yet.
    # Not when auto-update.yml is only trying a new Metabase (it passes metabase_version);
    # it dispatches this workflow again after the version bump, and that run releases.
    if: >-
      github.ref == 'refs/heads/main' && inputs.metabase_version == '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          v=$(grep -m1 -E '^\s+version:' resources/metabase/dynamodb/metabase-plugin.yaml | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$v already released"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "releasing v$v"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          name: dynamodb.metabase-driver.jar

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dynamodb.metabase-driver.jar
