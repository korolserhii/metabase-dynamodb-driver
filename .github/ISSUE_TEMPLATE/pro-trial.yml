name: Pro trial request
description: Request a free 30-day trial of the DynamoDB driver Pro edition
title: "Pro trial request"
labels: ["pro-trial"]
body:
  - type: markdown
    attributes:
      value: "Thanks! A few answers help decide what Pro does first. Do not paste credentials or table contents."
  - type: input
    id: size
    attributes:
      label: Largest table you want in Metabase
      placeholder: "e.g. 3 million items, about 2 GB"
    validations:
      required: true
  - type: dropdown
    id: need
    attributes:
      label: What matters most
      multiple: true
      options:
        - Large tables
        - Read-capacity / cost control
        - Hiding or masking attributes
        - Other AWS accounts (AssumeRole)
        - Support and guaranteed updates
  - type: textarea
    id: notes
    attributes:
      label: Anything else
