name: Pro early access request
description: Request a free 30-day trial of the DynamoDB driver Pro edition
title: "Pro early access request"
labels: ["pro-trial"]
body:
  - type: markdown
    attributes:
      value: "Thanks! A few answers help decide what Pro does first. Do not paste credentials or table contents. We reply in this issue, so you get a GitHub notification. This issue is public; for a private conversation email korolserhii.dev@gmail.com instead."
  - type: input
    id: size
    attributes:
      label: Largest table you want in Metabase
      placeholder: "e.g. 3 million items, about 2 GB"
    validations:
      required: true
  - type: input
    id: metabase
    attributes:
      label: Metabase version
      placeholder: "e.g. v0.65.3"
  - type: dropdown
    id: deploy
    attributes:
      label: How Metabase runs
      options: [Docker, JAR, Kubernetes, Other]
  - type: dropdown
    id: billing
    attributes:
      label: DynamoDB capacity mode of the large tables
      options: [On-demand, Provisioned, Both, Not sure]
  - type: dropdown
    id: need
    attributes:
      label: What matters most
      multiple: true
      options:
        - Large tables
        - Read-capacity / cost control
        - Hiding or masking attributes
        - Other AWS accounts (AssumeRole)
        - Support and guaranteed updates
  - type: textarea
    id: notes
    attributes:
      label: Anything else
